name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Package artifact
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "APK not found"; exit 1; }
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          CODE=$(grep -o 'versionCode [0-9]*' app/build.gradle | awk '{print $2}')
          NAME="CheGuanJia-Android-v${VERSION}-b${CODE}"
          cp "$APK" "${NAME}.apk"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          ls -lh "${NAME}.apk"

      - name: Verify signature
        run: |
          SDK_BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK_BT/apksigner" verify --print-certs "${APK_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carcare-android-apk
          path: "*.apk"
          if-no-files-found: error

      - name: Attach to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
